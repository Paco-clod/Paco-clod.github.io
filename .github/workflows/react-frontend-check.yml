name: React frontend validation

on:
  push:
    branches:
      - react-migration
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/react-frontend-check.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/react-frontend-check.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
